[package]
name = "farbe"
version = "0.1.0"
edition = "2024"
description = "Display stats about colors in CSS and SCSS files"
authors = ["Adam Burucs"]
license = "MIT"
repository = "https://github.com/krondorl/farbe.git"
keywords = ["css", "scss", "colors", "color-stats", "color-statistics", "color-palette", "styles"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"

[profile.release]
strip = true  # Strip symbols from the binary
opt-level = "z"  # Optimize for size
lto = true # Enable Link Time Optimization
codegen-units = 1 # Reduce Parallel Code Generation Units to Increase Optimization
panic = "abort" # Remove unwinding machinery
debug = false # Remove debug info completely
